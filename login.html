<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Desert Dance — Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;1,9..40,400&family=Jost:wght@300;400;600;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-dark': '#231f20',
            'brand-dark-elevated': '#2a2627',
            'brand-lime': '#d8e723',
            'brand-lime-hover': '#bcc91b',
            'brand-lime-dim': 'rgba(216,231,35,0.12)',
            'brand-white': '#ffffff',
            'brand-white-muted': 'rgba(255,255,255,0.55)',
            'brand-white-faint': 'rgba(255,255,255,0.08)',
          },
          fontFamily: {
            'title': ["'Jost'", 'sans-serif'],
            'italic-display': ["'Cormorant Garamond'", 'serif'],
            'body': ["'DM Sans'", 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="icon" href="assets/logos/favicon-32.png" type="image/png">
</head>
<body class="min-h-screen bg-brand-dark font-body antialiased">
  <div class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-md">
      <div class="text-center mb-10">
        <img src="assets/logos/vertical_primary.svg" alt="Desert Dance" class="h-20 mx-auto mb-6">
        <h1 class="font-title text-3xl font-black text-brand-white tracking-tight">Panel de <span class="italic-display italic text-brand-lime font-light">Administración</span></h1>
        <p class="text-brand-white-muted/50 text-sm mt-2">Acceso restringido para el equipo Desert Dance</p>
      </div>

      <form id="login-form" class="bg-brand-dark-elevated/80 backdrop-blur-xl rounded-[2rem] p-8 md:p-10 border border-brand-white-faint shadow-[0_0_60px_rgba(0,0,0,0.35)] space-y-5">
        <div>
          <label for="email" class="block text-[10px] font-extrabold text-brand-white-muted/40 uppercase tracking-[0.2em] mb-2">Correo electrónico</label>
          <input id="email" type="email" autocomplete="email" required
            class="w-full bg-brand-dark/50 border border-brand-white-faint rounded-xl px-5 py-3.5 text-sm text-brand-white placeholder:text-brand-white-muted/25 focus:outline-none focus:border-brand-lime/40 focus:ring-1 focus:ring-brand-lime/20 transition-all">
        </div>
        <div>
          <label for="password" class="block text-[10px] font-extrabold text-brand-white-muted/40 uppercase tracking-[0.2em] mb-2">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required
            class="w-full bg-brand-dark/50 border border-brand-white-faint rounded-xl px-5 py-3.5 text-sm text-brand-white placeholder:text-brand-white-muted/25 focus:outline-none focus:border-brand-lime/40 focus:ring-1 focus:ring-brand-lime/20 transition-all">
        </div>
        <p id="error-msg" class="hidden text-red-500 text-xs text-center"></p>
        <button type="submit" id="login-btn"
          class="w-full bg-brand-lime text-brand-dark font-extrabold text-sm tracking-[0.12em] uppercase py-4 rounded-xl hover:bg-brand-lime-hover shadow-[0_0_30px_rgba(216,231,35,0.25)] hover:shadow-[0_0_45px_rgba(216,231,35,0.4)] hover:-translate-y-0.5 transition-all duration-300">
          Iniciar Sesión
        </button>
      </form>

      <a href="index.html" class="block text-center mt-8 text-brand-white-muted/40 text-xs hover:text-brand-lime transition-colors tracking-wide">← Volver al sitio</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('login-form');
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');

      // Already logged in? -> admin
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'admin.html';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Verificando...';

        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });

        if (error) {
          errorMsg.textContent = 'Credenciales incorrectas. Intenta de nuevo.';
          errorMsg.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Iniciar Sesión';
          return;
        }

        window.location.href = 'admin.html';
      });
    });
  </script>
</body>
</html>
